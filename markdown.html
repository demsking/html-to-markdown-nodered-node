<script type="text/javascript">
  RED.nodes.registerType('to-markdown', {
    category: 'function',
    color: '#FFCC66',
    defaults: {
      name: { value: "Parse HTML to markdown" },
      html: { value: 'payload', required: true },
      htmlType: { value: 'msg', required: false },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-code",
    paletteLabel: "to markdown",
    inputLabels: "HTML",
    outputLabels: ["Markdown"],
    label() {
      return this.name || "Parse HTML to markdown";
    },
    oneditprepare() {
      $('#node-input-html').typedInput({
        type: 'msg',
        types: ['msg', 'flow', 'global'],
        typeField: '#node-input-htmlType'
      });
    },
  });
</script>

<script type="text/x-red" data-template-name="to-markdown">
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-html">HTML</label>
    <input type="text" id="node-input-html">
    <input type="hidden" id="node-input-htmlType" />
  </div>
</script>

<script type="text/x-red" data-help-name="to-markdown">
  <p>Parse HTML content found in <b>msg.payload</b> to markdown.</p>
  <p>Markdown text is saved in the <b>msg.payload</b> property, overriding the HTML content.</p>
</script>
